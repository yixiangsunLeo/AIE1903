# Runtime profile: device, threads, precision, determinism, budgets, seeds, output roots.
# Code must read these values and actually apply them; every run records the applied values.
# Facts behind the defaults: reports/audit/A-20261026-server/ (rules/30-server.md, rules/35-training.md).
schema_version: 2
profile: default

device: cpu              # cpu | cuda; cuda requires a GPU budget approved in the task card
gpu_index: 0             # single RTX 5090; exported as CUDA_VISIBLE_DEVICES ("" for cpu runs)
threads: 8               # OMP/OPENBLAS/MKL/NUMEXPR_NUM_THREADS and torch.set_num_threads
max_threads: 24          # cgroup CPU quota; os.cpu_count() reports 256 and must not be used
max_parallel_jobs: 1
seed: 42

precision: fp32_strict   # fp32_strict | tf32 | bf16_autocast; the image enables TF32 by default
deterministic: true      # torch.use_deterministic_algorithms(True), cudnn.benchmark = False

env:                     # exported for every run (training.md section 2)
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"
  PYTHONUNBUFFERED: "1"
  WANDB_MODE: disabled

budgets:                 # defaults per run; a task card may tighten or, with approval, relax them
  max_wall_minutes: 30   # enforced with `timeout`; exit code 124 is recorded as status timeout
  max_memory_gib: 8      # container limit is 32 GiB without swap
  max_gpu_memory_gib: null   # null = GPU not budgeted

outputs:                 # relative to the project root
  runs_root: runs                    # override: AIE1903_RUNS_ROOT
  run_summaries: reports/runs
  experiment_index: reports/experiments.csv
  submissions_root: submissions
  figures_root: reports/figures

predictions:
  clip_negative_to_zero: false   # non-negative is recommended, not required; any clipping is recorded
