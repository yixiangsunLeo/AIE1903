# Dataset registry and data contract.
# Facts: official PDFs + official repository at the pinned commit below; verified locally by
# audit A-20261026-framework (reports/audit/A-20261026-framework/data-audit.json).
# Local integrity: data/checksums.sha256 (sha256). Provenance: git_blob_sha1 + bytes below.
schema_version: 1
contract_version: official-49822d8
metric_definition_version: provisional-v1   # docs/decisions/ADR-0003

official_source:
  repository: https://github.com/AIE1903-DataCompetition-26AY/competition-data
  commit: 49822d82552c980bb83eb445548268f3565882ef
  commit_date: "2026-09-20T19:46:40+08:00"
  raw_url_template: "https://raw.githubusercontent.com/AIE1903-DataCompetition-26AY/competition-data/{commit}/{dataset_dir}/{file}"
  verified_locally: "2026-10-26"

data_root: data/raw                 # override: AIE1903_DATA_ROOT
checksums_file: data/checksums.sha256

common:
  sampling_minutes: 5
  day_cycle: 288
  horizon: 289
  train_rows: 1728
  test_rows: 289
  timestamp_column: timestamp
  timestamp_format: "%Y-%m-%d %H:%M:%S"
  timestamp_semantics: window_start   # t means [t, t+5min)
  timestamp_timezone: null            # recorded collection clock; never convert

isolation:                            # docs/decisions/ADR-0005
  one_dataset_per_run: true
  sample_values_forbidden: true       # sample files are format templates only; never read values
  allowed_cross_dataset:
    - consumer: grid_273
      provider: cell_30
      reason: identical time axis and official cell-grid hierarchy (CGPDF section 1); declare in task card; training rows only
  known_clock_offset:
    cell_30_vs_cell_217: "same measurements by row index; cell_30 labels are 50 min (10 steps) later"

datasets:
  cell_217:
    role: mainline
    level: intermediate
    dir: cell_217
    entity_prefix: Cell
    n_series: 217
    columns: timestamp + Cell_001..Cell_217 (218 total, exact order)
    train_range: ["2024-11-30 23:00:00", "2024-12-06 22:55:00"]
    test_range: ["2024-12-06 23:00:00", "2024-12-07 23:00:00"]
    values: {integer: true, min_inclusive: 1, zeros_expected: false, full_data_max: 28952520}
    scoring:
      track: cell
      mape_scope: all_entries
      masked_mape_thresholds: [300000, 1000000]
      test_entries: 62713
    files:
      train: {name: cell_217_train.csv, bytes: 2702241, git_blob_sha1: a72df10cbdbd90faf875cffa40886679d01f8ed8}
      test: {name: cell_217_test.csv, bytes: 70746, git_blob_sha1: f687e21cc72b7cf0c675296799120e3e5470ce8b}
      sample_submission: {name: cell_217_sample_submission.csv, bytes: 454503, git_blob_sha1: c188e03ee113a4dda2a1e3df53620ca44e25be6e}
      description: {name: data_description_for_cell_217.pdf, bytes: 215218, git_blob_sha1: 64b031f85ae80f7c9cf8821898a2b4ac8dc4fc69}

  cell_30:
    role: dry_run                     # pipeline rehearsal only; never mixed into cell_217
    level: beginner
    dir: cell_30
    entity_prefix: Cell
    n_series: 30
    columns: timestamp + Cell_001..Cell_030 (31 total, exact order)
    train_range: ["2024-11-30 23:50:00", "2024-12-06 23:45:00"]
    test_range: ["2024-12-06 23:50:00", "2024-12-07 23:50:00"]
    values: {integer: true, min_inclusive: 2088, zeros_expected: false, full_data_max: 28952521}
    scoring:
      track: cell
      mape_scope: all_entries
      masked_mape_thresholds: [300000, 1000000]
      test_entries: 8670
    files:
      train: {name: cell_30_train.csv, bytes: 426220, git_blob_sha1: 26b0552be2c1351038df6f7bf06781a872e2f36e}
      test: {name: cell_30_test.csv, bytes: 15020, git_blob_sha1: 1a07570ec64501306d017a7823240a7ddb19df00}
      sample_submission: {name: cell_30_sample_submission.csv, bytes: 71669, git_blob_sha1: 8988da9142b6c9687d3fdf1889152e4424df3e5c}
      description: {name: data_description_for_cell_grid.pdf, bytes: 227297, git_blob_sha1: 8df5a69391e564afb1b3fdde9fe32244d7a5b1c0}

  grid_273:
    role: optional_extension          # only after the cell_217 mainline is complete
    level: advanced
    dir: grid_273
    entity_prefix: Grid
    n_series: 273
    columns: timestamp + Grid_001..Grid_273 (274 total, exact order)
    train_range: ["2024-11-30 23:50:00", "2024-12-06 23:45:00"]
    test_range: ["2024-12-06 23:50:00", "2024-12-07 23:50:00"]
    values: {integer: true, min_inclusive: 0, zeros_expected: true, imputed_missing_fraction: 0.0531}
    scoring:
      track: grid
      mape_scope: y_true_gt_0
      masked_mape_thresholds: [10000, 100000]
      test_entries: 78897
    membership:
      file: grid_cell_membership.csv
      columns: [grid_id, cell_id, grid_index_within_cell]
      parents: "27 cells x 10 grids + 3 cells x 1 grid; parent ids Cell_001..Cell_030"
      parent_sum_equals_child_sum: false
    files:
      train: {name: grid_train.csv, bytes: 2564179, git_blob_sha1: d07ec8d2c5a5a630043e5c7644ef2532ab7708c6}
      test: {name: grid_test.csv, bytes: 87434, git_blob_sha1: f3223357fdd444676b28858a2f5a11bec6c83666}
      sample_submission: {name: grid_sample_submission.csv, bytes: 432404, git_blob_sha1: d454ff84359bec0b19b3e12653d12cfbb50c9594}
      membership: {name: grid_cell_membership.csv, bytes: 5773, git_blob_sha1: a3d469f424950d022c4a383386c804a9d70a43aa}
      description: {name: data_description_for_cell_grid.pdf, bytes: 227297, git_blob_sha1: 8df5a69391e564afb1b3fdde9fe32244d7a5b1c0}
